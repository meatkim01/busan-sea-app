<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나만의 부산 바다 레저 취향 찾기</title>
  <style>
    :root { --blue:#087eb4; --aqua:#18c8c8; --navy:#063d60; --ink:#163548; --line:#dcebee; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#d9f2f4,#e8effb); color:var(--ink); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
    .app { max-width:480px; min-height:100vh; margin:auto; padding:24px 20px 32px; background:#fff; box-shadow:0 0 35px #164c6530; }
    .eyebrow { margin:0; color:var(--blue); font-size:11px; font-weight:800; letter-spacing:.1em; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .account-button { flex-shrink:0; min-height:34px; padding:8px 11px; border:1px solid #b9e5e7; border-radius:999px; background:#f1ffff; color:#08707c; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    h1 { margin:8px 0 20px; font-size:25px; line-height:1.35; }
    .count { margin:0 0 8px; color:var(--blue); font-size:13px; font-weight:800; }
    .progress { height:8px; overflow:hidden; border-radius:8px; background:#e9f2f3; }
    .bar { height:100%; border-radius:8px; background:linear-gradient(90deg,var(--blue),var(--aqua)); transition:width .3s ease; }
    .question { animation:enter .25s ease; padding-top:18px; }
    .category { margin:0 0 8px; color:var(--blue); font-size:13px; font-weight:800; }
    .question h2 { margin:0 0 16px; font-size:22px; line-height:1.45; }
    .choice { width:100%; margin:9px 0; padding:17px; border:1px solid #d9e9ed; border-radius:17px; background:#fff; color:var(--ink); text-align:left; font:inherit; font-weight:700; line-height:1.45; cursor:pointer; transition:transform .15s,background .15s,border-color .15s; }
    .choice:hover, .choice:focus { border-color:var(--aqua); background:#f2ffff; transform:translateY(-1px); }
    .choice b { display:block; margin-bottom:5px; color:var(--blue); font-size:11px; letter-spacing:.08em; }
    .result { padding:20px; border-radius:22px; color:#fff; background:linear-gradient(135deg,#07567e,#0d9da9,#44d6cf); }
    .result h2 { margin:0; font-size:24px; line-height:1.35; }
    .result p { margin:8px 0 0; line-height:1.5; }
    .route { display:grid; gap:8px; margin-top:16px; }
    .route div { padding:11px; border-radius:10px; background:#ffffff24; font-size:13px; line-height:1.45; }
    .map-card { overflow:hidden; margin-top:16px; border:1px solid var(--line); border-radius:20px; background:#fff; }
    .map-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 14px 10px; }
    .map-heading strong { display:block; font-size:15px; }
    .map-heading small { display:block; margin-top:3px; color:#65808d; font-size:11px; }
    .density { display:inline-flex; align-items:center; gap:5px; flex-shrink:0; padding:6px 9px; border-radius:99px; font-size:11px; font-weight:800; }
    .density.busy { background:#fff0f0; color:#c52727; }
    .density.normal { background:#fff8df; color:#9a6900; }
    .density.quiet { background:#edf9f2; color:#16824c; }
    .map-frame { display:block; width:100%; height:210px; border:0; background:#e8f0f2; }
    .map-note { margin:0; padding:10px 14px 13px; color:#607a86; font-size:11px; line-height:1.5; }
    .tabs { display:flex; margin-top:20px; border-bottom:1px solid var(--line); }
    .tab { flex:1; padding:11px 2px; border:0; border-bottom:3px solid transparent; background:#fff; color:#718491; font:inherit; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .tab.active { border-color:var(--aqua); color:var(--blue); }
    .panel { padding-top:15px; }
    .panel[hidden] { display:none; }
    .info { margin-bottom:9px; padding:13px; border:1px solid var(--line); border-radius:14px; font-size:13px; line-height:1.55; }
    .parking-title { margin:18px 0 9px; color:var(--navy); font-size:15px; }
    .parking { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .parking strong { display:block; margin-bottom:3px; }
    .parking p { margin:0; color:#5e7884; font-size:12px; }
    .parking-status { flex-shrink:0; padding:5px 8px; border-radius:99px; font-size:11px; font-weight:800; }
    .parking-status.busy { background:#fff0f0; color:#c52727; }
    .parking-status.normal { background:#fff8df; color:#9a6900; }
    .parking-status.quiet { background:#edf9f2; color:#16824c; }
    .directions { margin-top:14px; padding:15px; border:1px solid #bfe9ec; border-radius:15px; background:linear-gradient(135deg,#efffff,#f6fbff); }
    .directions strong { display:block; margin-bottom:5px; color:#07567e; font-size:14px; }
    .directions p { margin:0; color:#51727e; font-size:12px; line-height:1.5; }
    .directions-button { width:100%; margin-top:11px; padding:11px; border:0; border-radius:10px; background:#087eb4; color:#fff; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    .directions-status { min-height:18px; margin:9px 0 0; color:#51727e; font-size:11px; line-height:1.4; }
    .directions-status.error { color:#c52727; }
    .reserve { width:100%; margin-top:10px; padding:10px; border:1px solid #93dce0; border-radius:10px; background:#edffff; color:#076d82; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    .retry { width:100%; margin-top:20px; padding:14px; border:0; border-radius:15px; background:var(--blue); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .modal-backdrop { position:fixed; inset:0; z-index:10; display:grid; place-items:end center; padding:16px; background:#001c2a88; }
    .modal { width:min(480px,100%); padding:20px; border-radius:22px; background:#fff; box-shadow:0 12px 40px #001c2a55; }
    .modal h2 { margin:0 0 6px; font-size:20px; }
    .modal p { margin:0 0 14px; color:#5a717d; font-size:13px; line-height:1.5; }
    .form-grid { display:grid; gap:10px; }
    .form-grid label { display:grid; gap:5px; font-size:12px; font-weight:800; }
    .form-grid input, .form-grid select { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); font:inherit; }
    .modal-actions { display:flex; gap:8px; margin-top:16px; }
    .modal-actions button { flex:1; padding:12px; border-radius:11px; font:inherit; font-weight:800; cursor:pointer; }
    .cancel { border:1px solid var(--line); background:#fff; color:#637b86; }
    .submit { border:0; background:var(--blue); color:#fff; }
    .auth-backdrop[hidden] { display:none; }
    .auth-backdrop { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:#001c2a88; }
    .auth-modal { width:min(420px,100%); padding:22px; border-radius:22px; background:#fff; box-shadow:0 12px 40px #001c2a55; }
    .auth-modal h2 { margin:0 0 6px; font-size:21px; }
    .auth-help { margin:0 0 16px; color:#607a86; font-size:12px; line-height:1.5; }
    .auth-switch { display:flex; gap:8px; margin-bottom:14px; }
    .auth-switch button { flex:1; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:#637b86; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
    .auth-switch button.active { border-color:var(--aqua); background:#efffff; color:#08707c; }
    .auth-message { min-height:18px; margin:10px 0 0; font-size:12px; line-height:1.4; }
    .auth-message.error { color:#c52727; }
    .auth-message.success { color:#16824c; }
    @keyframes enter { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <p class="eyebrow">BUSAN SEA LEISURE</p>
      <button id="accountButton" class="account-button" type="button">로그인</button>
    </div>
    <h1>🌊 나만의 부산 바다<br>레저 취향 찾기</h1>

    <section id="quiz">
      <p id="count" class="count"></p>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div id="question"></div>
    </section>

    <section id="resultScreen" hidden>
      <div id="resultCard" class="result"></div>
      <section id="mapCard" class="map-card" aria-label="추천 지역 지도와 예상 혼잡도"></section>
      <nav id="tabs" class="tabs" aria-label="추천 정보 탭">
        <button class="tab active" data-tab="sport">🏄 레저 정보</button>
        <button class="tab" data-tab="food">🍽️ 추천 맛집</button>
        <button class="tab" data-tab="traffic">🚌 교통 안내</button>
      </nav>
      <div id="sport" class="panel"></div>
      <div id="food" class="panel" hidden></div>
      <div id="traffic" class="panel" hidden></div>
      <button id="retry" class="retry">테스트 다시 하기</button>
    </section>
  </main>

  <div id="authModal" class="auth-backdrop" hidden>
    <section class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <h2 id="authTitle">부산 바다 앱 로그인</h2>
      <p id="authHelp" class="auth-help">이메일과 비밀번호로 로그인해 주세요.</p>
      <div class="auth-switch" aria-label="인증 방식">
        <button id="loginMode" class="active" type="button">로그인</button>
        <button id="signupMode" type="button">회원가입</button>
      </div>
      <form id="authForm" class="form-grid">
        <label>이메일 <input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <label>비밀번호 <input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상" required></label>
        <button id="authSubmit" class="submit" type="submit">로그인</button>
      </form>
      <p id="authMessage" class="auth-message" role="status"></p>
      <div class="modal-actions"><button id="authClose" class="cancel" type="button">닫기</button></div>
    </section>
  </div>

  <script>
    // 선택 순서는 A=0, B=1입니다. 결과는 선택 성향에 따라 계산됩니다.

        parking:[
          {name:'태종대 유원지 공영주차장', detail:'태종대 입구 인근 · 유람선 운항 시간대에 차량이 몰릴 수 있어요.', status:'보통', className:'normal'},
          {name:'감지해변 주변 주차 공간', detail:'감지해변 방향 · 공간이 제한적이어서 대중교통 이용을 권장해요.', status:'혼잡', className:'busy'}
        ]
      },
      {
        name:'🏖️ 여유로운 해변 힐링러',
        description:'조용한 해변에서 천천히 쉬며 바다의 시간을 즐기고 싶은 타입이에요.',
        district:'사하구 · 다대포 해수욕장', density:'한적', densityClass:'quiet', densityNote:'해변이 넓어 여유로운 편이에요. 다만 일몰과 낙조분수 시간에는 방문객이 늘어납니다.',
        destination:{name:'다대포 해수욕장',lat:35.052,lng:128.972},
        mapUrl:'https://www.openstreetmap.org/export/embed.html?bbox=128.960%2C35.041%2C128.984%2C35.060&layer=mapnik&marker=35.052%2C128.972',
        route:['다대포 해수욕장 & 생태탐방로','다대포 카이트서핑 패들보드 클럽','할매집 → 다대포 낙조분수'],
        sport:['다대포 카이트서핑 패들보드 클럽 · 부산 사하구 다대등대로 14 · 얕은 수심에서 패들보드를 즐길 수 있어요.','일몰과 낙조분수 운영 시간은 방문 전에 확인해 주세요.'],
        food:['할매집 · 부산 사하구 다대하나거리 40 · 해물파전과 문어삼합','웨이브온 커피 · 부산 기장군 장안읍 해맞이로 286 · 기장으로 코스를 넓힐 때 들르기 좋아요.'],
        traffic:['1호선 다대포해수욕장역 1번 또는 2번 출구에서 백사장까지 바로 이동할 수 있어요.','차량 이용 시 다대포 해변공원 주차장 위치를 미리 확인해 주세요.'],
        parking:[
          {name:'다대포 해변공원 주차장', detail:'해수욕장 인근 · 해변이 넓어 주간에는 비교적 여유로운 편이에요.', status:'한적', className:'quiet'},
          {name:'다대포 꿈의 낙조분수 주변 주차장', detail:'낙조분수 운영 전후와 일몰 시간에는 차량이 몰릴 수 있어요.', status:'보통', className:'normal'}
        ]
      }
    ];

    let index = 0;
    let answers = [];
    const $ = selector => document.querySelector(selector);

    function renderQuestion() {
      const [category, prompt, optionA, optionB] = questions[index];
      $('#count').textContent = `${index + 1} / ${questions.length}`;
      $('#bar').style.width = `${(index / questions.length) * 100}%`;
      $('#question').innerHTML = `
        <article class="question">
          <p class="category">Q${index + 1}. ${category}</p>
          <h2>${prompt}</h2>
          <button class="choice" data-answer="0"><b>A</b>${optionA}</button>
          <button class="choice" data-answer="1"><b>B</b>${optionB}</button>
        </article>`;
    }

    $('#question').addEventListener('click', event => {
      const button = event.target.closest('[data-answer]');
      if (!button) return;
      answers.push(Number(button.dataset.answer));
      index += 1;
      if (index < questions.length) renderQuestion();
      else renderResult();
    });

    function renderResult() {
      const aCount = answers.filter(answer => answer === 0).length;
      const resultIndex = aCount >= 7 ? 0 : aCount <= 3 ? 3 : answers[3] === 0 ? 1 : 2;
      const result = results[resultIndex];
      $('#quiz').hidden = true;
      $('#resultScreen').hidden = false;
      $('#resultCard').innerHTML = `<h2>${result.name}</h2><p>${result.description}</p><div class="route">${result.route.map((item, i) => `<div>${i + 1}. ${item}</div>`).join('')}</div>`;
      $('#mapCard').innerHTML = `
        <div class="map-heading">
          <div><strong>📍 ${result.district}</strong><small>실제 약도 · OpenStreetMap</small></div>
          <span class="density ${result.densityClass}">● 예상 ${result.density}</span>
        </div>
        <iframe class="map-frame" title="${result.district} 지도" src="${result.mapUrl}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <p class="map-note">${result.densityNote} 혼잡도는 실시간 수치가 아닌 코스 선택을 돕기 위한 대략적인 안내입니다.</p>`;
      ['sport','food'].forEach(key => {
        const buttonLabel = key === 'sport' ? '레저 예약 신청' : key === 'food' ? '맛집 예약·웨이팅 신청' : '';
        $(`#${key}`).innerHTML = result[key].map(item => `<article class="info">${item}${buttonLabel ? `<button class="reserve" data-place="${item.replace(/"/g, '&quot;')}">${buttonLabel}</button>` : ''}</article>`).join('');
      });
      $('#traffic').innerHTML = `
        ${result.traffic.map(item => `<article class="info">${item}</article>`).join('')}
        <h3 class="parking-title">🅿️ 주변 주차장</h3>
        ${result.parking.map(parking => `<article class="info parking"><div><strong>${parking.name}</strong><p>${parking.detail}</p></div><span class="parking-status ${parking.className}">예상 ${parking.status}</span></article>`).join('')}
        <section class="directions">
          <strong>📍 현재 위치에서 길찾기</strong>
          <p>현재 위치를 사용해 <b>${result.destination.name}</b>까지의 대중교통 경로를 엽니다.</p>
          <button class="directions-button" type="button" data-destination-lat="${result.destination.lat}" data-destination-lng="${result.destination.lng}" data-destination-name="${result.destination.name}">현재 위치에서 ${result.destination.name} 가기</button>
          <p class="directions-status" aria-live="polite">위치 정보는 길찾기 링크 생성에만 사용되며 저장하지 않습니다.</p>
        </section>
        <p class="map-note">주차 혼잡도는 실시간 정보가 아닌 방문 시간대 기준의 예상 안내입니다. 출발 전 주차장 운영 정보와 빈자리 여부를 확인해 주세요.</p>`;
      $('#bar').style.width = '100%';
    }

    $('#tabs').addEventListener('click', event => {
      const button = event.target.closest('.tab');
      if (!button) return;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab === button));
      ['sport','food','traffic'].forEach(key => { $(`#${key}`).hidden = key !== button.dataset.tab; });
    });

    // 예약 양식은 테스트 결과에서 특정 업체를 선택했을 때만 생성됩니다.
    $('#resultScreen').addEventListener('click', event => {
      const button = event.target.closest('.reserve');
      if (button) {
        openBooking(button.dataset.place, button.textContent);
        return;
      }
      const directionsButton = event.target.closest('.directions-button');
      if (directionsButton) openDirections(directionsButton);
    });

    // 위치 권한은 사용자가 길찾기 버튼을 눌렀을 때만 요청하며, 좌표를 저장하지 않습니다.
    function openDirections(button) {
      const status = button.parentElement.querySelector('.directions-status');
      if (!navigator.geolocation) {
        status.textContent = '이 브라우저에서는 현재 위치 기능을 지원하지 않습니다.';
        status.classList.add('error');
        return;
      }
      button.disabled = true;
      button.textContent = '현재 위치 확인 중…';
      status.classList.remove('error');
      status.textContent = '위치 권한을 허용하면 대중교통 길찾기를 엽니다.';
      navigator.geolocation.getCurrentPosition(position => {
        const origin = `${position.coords.latitude},${position.coords.longitude}`;
        const destination = `${button.dataset.destinationLat},${button.dataset.destinationLng}`;
        const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=transit`;
        window.open(url, '_blank', 'noopener');
        status.textContent = `${button.dataset.destinationName}까지의 대중교통 길찾기를 새 탭에서 열었습니다.`;
        button.disabled = false;
        button.textContent = `현재 위치에서 ${button.dataset.destinationName} 가기`;
      }, error => {
        const message = error.code === error.PERMISSION_DENIED ? '위치 권한이 필요합니다. 브라우저에서 위치 접근을 허용해 주세요.' : '현재 위치를 가져오지 못했습니다. 잠시 후 다시 시도해 주세요.';
        status.textContent = message;
        status.classList.add('error');
        button.disabled = false;
        button.textContent = `현재 위치에서 ${button.dataset.destinationName} 가기`;
      }, { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
    }

    function openBooking(place, actionLabel) {
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.setAttribute('role', 'dialog');
      modal.setAttribute('aria-modal', 'true');
      modal.innerHTML = `
        <form class="modal">
          <h2>${actionLabel}</h2>
          <p>${place}</p>
          <div class="form-grid">
            <label>방문 날짜 <input name="date" type="date" min="${new Date().toISOString().slice(0, 10)}" required></label>
            <label>희망 시간 <select name="time"><option>오전 10:00</option><option>오후 1:00</option><option>오후 4:00</option><option>오후 7:00</option></select></label>
            <label>인원 <select name="people"><option>1명</option><option>2명</option><option>3명</option><option>4명 이상</option></select></label>
            <label>이름 <input name="name" type="text" placeholder="예약자 이름" required></label>
          </div>
          <div class="modal-actions"><button type="button" class="cancel">취소</button><button type="submit" class="submit">예약 요청하기</button></div>
        </form>`;
      document.body.append(modal);
      modal.querySelector('[name="name"]').focus();
      modal.querySelector('.cancel').addEventListener('click', () => modal.remove());
      modal.addEventListener('click', event => { if (event.target === modal) modal.remove(); });
      modal.querySelector('form').addEventListener('submit', event => {
        event.preventDefault();
        const form = event.currentTarget;
        alert(`${form.elements.name.value.trim()}님, ${place}\n${form.elements.date.value} ${form.elements.time.value} · ${form.elements.people.value} 예약 요청이 접수되었습니다.\n\n현재는 데모 예약 기능입니다. 실제 예약은 업체 확인 후 진행해 주세요.`);
        modal.remove();
      });
    }

    $('#retry').addEventListener('click', () => {
      index = 0;
      answers = [];
      $('#quiz').hidden = false;
      $('#resultScreen').hidden = true;
      document.querySelector('[data-tab="sport"]').click();
      renderQuestion();
    });

    renderQuestion();
  </script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';

    // Firebase 웹 앱 설정: 이메일/비밀번호는 Firebase Authentication에서 안전하게 처리됩니다.
    const firebaseConfig = {
      apiKey: 'AIzaSyCNd7gCskT--idV3_LCvCvyNNNf0rM-DY0',
      authDomain: 'busan-sea-app.firebaseapp.com',
      projectId: 'busan-sea-app',
      storageBucket: 'busan-sea-app.firebasestorage.app',
      messagingSenderId: '377922115846',
      appId: '1:377922115846:web:f7d952cdc2e5300a882687',
      measurementId: 'G-TTHXGYSFTW'
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const accountButton = document.querySelector('#accountButton');
    const authModal = document.querySelector('#authModal');
    const authForm = document.querySelector('#authForm');
    const authEmail = document.querySelector('#authEmail');
    const authPassword = document.querySelector('#authPassword');
    const authMessage = document.querySelector('#authMessage');
    const authHelp = document.querySelector('#authHelp');
    const authSubmit = document.querySelector('#authSubmit');
    const loginMode = document.querySelector('#loginMode');
    const signupMode = document.querySelector('#signupMode');
    let mode = 'login';
    let currentUser = null;

    function setMessage(message = '', type = '') {
      authMessage.textContent = message;
      authMessage.className = `auth-message ${type}`;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const signingUp = mode === 'signup';
      loginMode.classList.toggle('active', !signingUp);
      signupMode.classList.toggle('active', signingUp);
      authSubmit.textContent = signingUp ? '회원가입' : '로그인';
      authHelp.textContent = signingUp ? '비밀번호는 6자 이상으로 입력해 주세요.' : '이메일과 비밀번호로 로그인해 주세요.';
      authPassword.autocomplete = signingUp ? 'new-password' : 'current-password';
      setMessage();
    }

    function openAuth() {
      setMode('login');
      authForm.reset();
      authModal.hidden = false;
      authEmail.focus();
    }

    function closeAuth() {
      authModal.hidden = true;
      setMessage();
    }

    function friendlyError(error) {
      const codes = {
        'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않습니다.',
        'auth/email-already-in-use': '이미 가입된 이메일입니다. 로그인해 주세요.',
        'auth/invalid-email': '이메일 주소 형식을 확인해 주세요.',
        'auth/weak-password': '비밀번호는 6자 이상으로 입력해 주세요.',
        'auth/network-request-failed': '네트워크 연결을 확인해 주세요.',
        'auth/too-many-requests': '요청이 많습니다. 잠시 후 다시 시도해 주세요.'
      };
      return codes[error.code] || '로그인 처리 중 문제가 생겼습니다. 잠시 후 다시 시도해 주세요.';
    }

    accountButton.addEventListener('click', async () => {
      if (currentUser) {
        await signOut(auth);
        return;
      }
      openAuth();
    });
    loginMode.addEventListener('click', () => setMode('login'));
    signupMode.addEventListener('click', () => setMode('signup'));
    document.querySelector('#authClose').addEventListener('click', closeAuth);
    authModal.addEventListener('click', event => { if (event.target === authModal) closeAuth(); });

    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      const email = authEmail.value.trim();
      const password = authPassword.value;
      authSubmit.disabled = true;
      authSubmit.textContent = '처리 중…';
      setMessage();
      try {
        if (mode === 'signup') {
          await createUserWithEmailAndPassword(auth, email, password);
          setMessage('회원가입이 완료되었습니다.', 'success');
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          closeAuth();
        }
      } catch (error) {
        setMessage(friendlyError(error), 'error');
      } finally {
        authSubmit.disabled = false;
        authSubmit.textContent = mode === 'signup' ? '회원가입' : '로그인';
      }
    });

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        const nickname = (user.email || '내 계정').split('@')[0];
        accountButton.textContent = `${nickname} · 로그아웃`;
        closeAuth();
      } else {
        accountButton.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
