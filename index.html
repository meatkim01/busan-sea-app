<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나만의 부산 바다 레저 취향 찾기</title>
  <style>
    :root { --blue:#087eb4; --aqua:#18c8c8; --navy:#063d60; --ink:#163548; --line:#dcebee; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#d9f2f4,#e8effb); color:var(--ink); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
    .app { max-width:480px; min-height:100vh; margin:auto; padding:24px 20px 32px; background:#fff; box-shadow:0 0 35px #164c6530; }
    .eyebrow { margin:0; color:var(--blue); font-size:11px; font-weight:800; letter-spacing:.1em; }
    h1 { margin:8px 0 20px; font-size:25px; line-height:1.35; }
    .count { margin:0 0 8px; color:var(--blue); font-size:13px; font-weight:800; }
    .progress { height:8px; overflow:hidden; border-radius:8px; background:#e9f2f3; }
    .bar { height:100%; border-radius:8px; background:linear-gradient(90deg,var(--blue),var(--aqua)); transition:width .3s ease; }
    .question { animation:enter .25s ease; padding-top:18px; }
    .category { margin:0 0 8px; color:var(--blue); font-size:13px; font-weight:800; }
    .question h2 { margin:0 0 16px; font-size:22px; line-height:1.45; }
    .choice { width:100%; margin:9px 0; padding:17px; border:1px solid #d9e9ed; border-radius:17px; background:#fff; color:var(--ink); text-align:left; font:inherit; font-weight:700; line-height:1.45; cursor:pointer; transition:transform .15s,background .15s,border-color .15s; }
    .choice:hover, .choice:focus { border-color:var(--aqua); background:#f2ffff; transform:translateY(-1px); }
    .choice b { display:block; margin-bottom:5px; color:var(--blue); font-size:11px; letter-spacing:.08em; }
    .result { padding:20px; border-radius:22px; color:#fff; background:linear-gradient(135deg,#07567e,#0d9da9,#44d6cf); }
    .result h2 { margin:0; font-size:24px; line-height:1.35; }
    .result p { margin:8px 0 0; line-height:1.5; }
    .route { display:grid; gap:8px; margin-top:16px; }
    .route div { padding:11px; border-radius:10px; background:#ffffff24; font-size:13px; line-height:1.45; }
    .map-card { overflow:hidden; margin-top:16px; border:1px solid var(--line); border-radius:20px; background:#fff; }
    .map-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 14px 10px; }
    .map-heading strong { display:block; font-size:15px; }
    .map-heading small { display:block; margin-top:3px; color:#65808d; font-size:11px; }
    .density { display:inline-flex; align-items:center; gap:5px; flex-shrink:0; padding:6px 9px; border-radius:99px; font-size:11px; font-weight:800; }
    .density.busy { background:#fff0f0; color:#c52727; }
    .density.normal { background:#fff8df; color:#9a6900; }
    .density.quiet { background:#edf9f2; color:#16824c; }
    .map-frame { display:block; width:100%; height:210px; border:0; background:#e8f0f2; }
    .map-note { margin:0; padding:10px 14px 13px; color:#607a86; font-size:11px; line-height:1.5; }
    .tabs { display:flex; margin-top:20px; border-bottom:1px solid var(--line); }
    .tab { flex:1; padding:11px 2px; border:0; border-bottom:3px solid transparent; background:#fff; color:#718491; font:inherit; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .tab.active { border-color:var(--aqua); color:var(--blue); }
    .panel { padding-top:15px; }
    .panel[hidden] { display:none; }
    .info { margin-bottom:9px; padding:13px; border:1px solid var(--line); border-radius:14px; font-size:13px; line-height:1.55; }
    .reserve { width:100%; margin-top:10px; padding:10px; border:1px solid #93dce0; border-radius:10px; background:#edffff; color:#076d82; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    .retry { width:100%; margin-top:20px; padding:14px; border:0; border-radius:15px; background:var(--blue); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .modal-backdrop { position:fixed; inset:0; z-index:10; display:grid; place-items:end center; padding:16px; background:#001c2a88; }
    .modal { width:min(480px,100%); padding:20px; border-radius:22px; background:#fff; box-shadow:0 12px 40px #001c2a55; }
    .modal h2 { margin:0 0 6px; font-size:20px; }
    .modal p { margin:0 0 14px; color:#5a717d; font-size:13px; line-height:1.5; }
    .form-grid { display:grid; gap:10px; }
    .form-grid label { display:grid; gap:5px; font-size:12px; font-weight:800; }
    .form-grid input, .form-grid select { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); font:inherit; }
    .modal-actions { display:flex; gap:8px; margin-top:16px; }
    .modal-actions button { flex:1; padding:12px; border-radius:11px; font:inherit; font-weight:800; cursor:pointer; }
    .cancel { border:1px solid var(--line); background:#fff; color:#637b86; }
    .submit { border:0; background:var(--blue); color:#fff; }
    @keyframes enter { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">BUSAN SEA LEISURE</p>
    <h1>🌊 나만의 부산 바다<br>레저 취향 찾기</h1>

    <section id="quiz">
      <p id="count" class="count"></p>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div id="question"></div>
    </section>

    <section id="resultScreen" hidden>
      <div id="resultCard" class="result"></div>
      <section id="mapCard" class="map-card" aria-label="추천 지역 지도와 예상 혼잡도"></section>
      <nav id="tabs" class="tabs" aria-label="추천 정보 탭">
        <button class="tab active" data-tab="sport">🏄 레저 정보</button>
        <button class="tab" data-tab="food">🍽️ 추천 맛집</button>
        <button class="tab" data-tab="traffic">🚌 교통 안내</button>
      </nav>
      <div id="sport" class="panel"></div>
      <div id="food" class="panel" hidden></div>
      <div id="traffic" class="panel" hidden></div>
      <button id="retry" class="retry">테스트 다시 하기</button>
    </section>
  </main>

  <script>
    // 선택 순서는 A=0, B=1입니다. 결과는 선택 성향에 따라 계산됩니다.
    const questions = [
      ['오늘의 레저', '오늘 바다에서는 어떤 방식으로 놀고 싶나요?', '파도와 함께 신나게 즐기는 서핑·제트스키', '잔잔한 바다에서 느긋하게 타는 SUP·요트'],
      ['바다의 파도', '어떤 파도에서 가장 기분 좋게 놀 수 있을까요?', '제법 파도가 있어 몸을 움직이기 좋은 곳', '물결이 잔잔해서 편하게 놀기 좋은 곳'],
      ['해변의 촉감', '발밑에 닿는 해변은 어디가 더 좋나요?', '맨발로 걷기 좋은 보드라운 모래사장', '파도 소리가 좋은 몽돌·자갈 해변과 바위 해안'],
      ['보고 싶은 풍경', '눈앞에 어떤 바다 풍경이 펼쳐지면 좋겠나요?', '광안대교와 빌딩 불빛이 어우러진 도시 바다', '수평선과 절벽이 시원하게 펼쳐지는 자연 바다'],
      ['바다에 가기 좋은 시간', '오늘 바다의 가장 좋은 시간은 언제인가요?', '햇살 좋은 낮, 물놀이를 마음껏 할 때', '하늘이 물드는 해 질 무렵, 천천히 즐길 때'],
      ['해변의 분위기', '어떤 해변 분위기가 더 마음에 드나요?', '음악과 사람들로 북적이는 활기찬 곳', '파도 소리를 들으며 쉬기 좋은 조용한 곳'],
      ['물에 들어갈 때', '물놀이할 때 더 중요하게 생각하는 것은 무엇인가요?', '따뜻하고 수심이 완만한 바다', '조금 차가워도 맑고 투명한 바다'],
      ['레저를 즐긴 뒤', '바다에서 신나게 논 다음에는 뭘 하고 싶나요?', '오션뷰 카페나 와인바에서 여유롭게 쉬기', '해녀촌이나 포장마차에서 해산물 즐기기'],
      ['가는 방법', '바다로 갈 때 더 중요하게 생각하는 기준은 무엇인가요?', '지하철에서 내려 가볍게 걸어갈 수 있는 곳', '드라이브하고 주차까지 편한 곳'],
      ['오늘의 여행 목표', '이번 바다 여행에서 가장 남기고 싶은 것은 무엇인가요?', '새로운 해양 레저를 제대로 배워 보기', '바다를 배경으로 사진과 추억을 남기기']
    ];

    const results = [
      {
        name:'🏄‍♂️ 다이내믹 익스트림 서퍼',
        description:'에너지 넘치는 파도와 새로운 기술에 도전하는 걸 좋아하는 타입이에요.',
        district:'해운대구 · 송정 해수욕장', density:'혼잡', densityClass:'busy', densityNote:'주말 낮과 파도가 좋은 날에는 서핑 수요가 몰려 혼잡할 수 있어요.',
        mapUrl:'https://www.openstreetmap.org/export/embed.html?bbox=129.184%2C35.173%2C129.211%2C35.188&layer=mapnik&marker=35.179%2C129.201',
        route:['송정 해수욕장 · 부산 해운대구 송정해변로 36','서프홀릭 송정본점','료미 송정점 → 문토스트 본점'],
        sport:['서프홀릭 송정본점 · 부산 해운대구 송정구길 47 1층','입문자 패키지와 장비 대여를 이용할 수 있어요. 파도와 기상은 출발 전에 꼭 확인해 주세요.'],
        food:['료미 송정점 · 부산 해운대구 송정광정로 87 1층 · 오션뷰 퓨전 일식','문토스트 본점 · 부산 해운대구 송정해변로 16 · 서핑 뒤에 먹기 좋은 치즈 토스트'],
        traffic:['동해선 송정역 2번 출구에서 도보 약 10분','185번 버스 이용 후 송정해수욕장 입구 정류장에서 하차']
      },
      {
        name:'⛵ 럭셔리 선셋 요트 세일러',
        description:'반짝이는 야경과 노을을 보며 여유롭게 바다를 즐기는 타입이에요.',
        district:'수영구 · 광안리 해수욕장', density:'보통', densityClass:'normal', densityNote:'저녁과 주말에는 광안대교 야경을 보려는 방문객이 늘어날 수 있어요.',
        mapUrl:'https://www.openstreetmap.org/export/embed.html?bbox=129.105%2C35.147%2C129.125%2C35.160&layer=mapnik&marker=35.153%2C129.118',
        route:['광안리 해수욕장 & 수영만 요트경기장','크레이지서프 광안리 → 요트탈래 부산본점','톤쇼우 광안점 → Clam 광안리점'],
        sport:['크레이지서프 광안리 · 부산 수영구 광안해변로54번길 3 · 광안대교를 보며 SUP 체험','요트탈래 부산본점 · 부산 해운대구 해운대해변로 84 수영만요트경기장 · 선셋 시간대는 미리 예약해 주세요.'],
        food:['톤쇼우 광안점 · 부산 수영구 광안해변로279번길 13 · 프리미엄 돈카츠','Clam 광안리점 · 부산 수영구 광안해변로 225 · 타파스와 와인을 즐길 수 있어요.'],
        traffic:['2호선 광안역 3번 또는 5번 출구에서 백사장 방향으로 도보 약 10분','요트경기장 방문 전에는 주차 가능 여부와 출항 시간을 확인해 주세요.']
      },
      {
        name:'🌊 자연 감성 오션 어드벤처',
        description:'절경과 자연 해안선을 따라 바다를 깊이 느끼고 싶은 타입이에요.',
        district:'영도구 · 태종대', density:'한적', densityClass:'quiet', densityNote:'도심 해변보다 비교적 여유롭지만, 유람선 운항 시간대에는 방문객이 모일 수 있어요.',
        mapUrl:'https://www.openstreetmap.org/export/embed.html?bbox=129.061%2C35.044%2C129.083%2C35.060&layer=mapnik&marker=35.052%2C129.073',
        route:['영도 태종대 & 감지해변','태종대 곤포 유람선','자갈마당 해녀촌 → 피아크'],
        sport:['태종대 곤포 유람선 · 부산 영도구 감지해변길 79 · 해안 절벽과 오륙도 풍경을 둘러볼 수 있어요.','해안 산책에는 편한 신발과 바람막이를 챙기는 것을 추천해요.'],
        food:['태종대 자갈마당 해녀촌 · 부산 영도구 감지해변길 81 · 숯불 조개구이','피아크(P.ARK) · 부산 영도구 해양로195번길 180 · 항만 풍경을 볼 수 있는 복합문화 카페'],
        traffic:['부산역 7번 출구 인근 정류장에서 88번 또는 101번 버스 이용','태종대 종점에서 내려 산책로를 따라 이동하세요.']
      },
      {
        name:'🏖️ 여유로운 해변 힐링러',
        description:'조용한 해변에서 천천히 쉬며 바다의 시간을 즐기고 싶은 타입이에요.',
        district:'사하구 · 다대포 해수욕장', density:'한적', densityClass:'quiet', densityNote:'해변이 넓어 여유로운 편이에요. 다만 일몰과 낙조분수 시간에는 방문객이 늘어납니다.',
        mapUrl:'https://www.openstreetmap.org/export/embed.html?bbox=128.960%2C35.041%2C128.984%2C35.060&layer=mapnik&marker=35.052%2C128.972',
        route:['다대포 해수욕장 & 생태탐방로','다대포 카이트서핑 패들보드 클럽','할매집 → 다대포 낙조분수'],
        sport:['다대포 카이트서핑 패들보드 클럽 · 부산 사하구 다대등대로 14 · 얕은 수심에서 패들보드를 즐길 수 있어요.','일몰과 낙조분수 운영 시간은 방문 전에 확인해 주세요.'],
        food:['할매집 · 부산 사하구 다대하나거리 40 · 해물파전과 문어삼합','웨이브온 커피 · 부산 기장군 장안읍 해맞이로 286 · 기장으로 코스를 넓힐 때 들르기 좋아요.'],
        traffic:['1호선 다대포해수욕장역 1번 또는 2번 출구에서 백사장까지 바로 이동할 수 있어요.','차량 이용 시 다대포 해변공원 주차장 위치를 미리 확인해 주세요.']
      }
    ];

    let index = 0;
    let answers = [];
    const $ = selector => document.querySelector(selector);

    function renderQuestion() {
      const [category, prompt, optionA, optionB] = questions[index];
      $('#count').textContent = `${index + 1} / ${questions.length}`;
      $('#bar').style.width = `${(index / questions.length) * 100}%`;
      $('#question').innerHTML = `
        <article class="question">
          <p class="category">Q${index + 1}. ${category}</p>
          <h2>${prompt}</h2>
          <button class="choice" data-answer="0"><b>A</b>${optionA}</button>
          <button class="choice" data-answer="1"><b>B</b>${optionB}</button>
        </article>`;
    }

    $('#question').addEventListener('click', event => {
      const button = event.target.closest('[data-answer]');
      if (!button) return;
      answers.push(Number(button.dataset.answer));
      index += 1;
      if (index < questions.length) renderQuestion();
      else renderResult();
    });

    function renderResult() {
      const aCount = answers.filter(answer => answer === 0).length;
      const resultIndex = aCount >= 7 ? 0 : aCount <= 3 ? 3 : answers[3] === 0 ? 1 : 2;
      const result = results[resultIndex];
      $('#quiz').hidden = true;
      $('#resultScreen').hidden = false;
      $('#resultCard').innerHTML = `<h2>${result.name}</h2><p>${result.description}</p><div class="route">${result.route.map((item, i) => `<div>${i + 1}. ${item}</div>`).join('')}</div>`;
      $('#mapCard').innerHTML = `
        <div class="map-heading">
          <div><strong>📍 ${result.district}</strong><small>실제 약도 · OpenStreetMap</small></div>
          <span class="density ${result.densityClass}">● 예상 ${result.density}</span>
        </div>
        <iframe class="map-frame" title="${result.district} 지도" src="${result.mapUrl}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <p class="map-note">${result.densityNote} 혼잡도는 실시간 수치가 아닌 코스 선택을 돕기 위한 대략적인 안내입니다.</p>`;
      ['sport','food','traffic'].forEach(key => {
        const buttonLabel = key === 'sport' ? '레저 예약 신청' : key === 'food' ? '맛집 예약·웨이팅 신청' : '';
        $(`#${key}`).innerHTML = result[key].map(item => `<article class="info">${item}${buttonLabel ? `<button class="reserve" data-place="${item.replace(/"/g, '&quot;')}">${buttonLabel}</button>` : ''}</article>`).join('');
      });
      $('#bar').style.width = '100%';
    }

    $('#tabs').addEventListener('click', event => {
      const button = event.target.closest('.tab');
      if (!button) return;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab === button));
      ['sport','food','traffic'].forEach(key => { $(`#${key}`).hidden = key !== button.dataset.tab; });
    });

    // 예약 양식은 테스트 결과에서 특정 업체를 선택했을 때만 생성됩니다.
    $('#resultScreen').addEventListener('click', event => {
      const button = event.target.closest('.reserve');
      if (!button) return;
      openBooking(button.dataset.place, button.textContent);
    });

    function openBooking(place, actionLabel) {
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.setAttribute('role', 'dialog');
      modal.setAttribute('aria-modal', 'true');
      modal.innerHTML = `
        <form class="modal">
          <h2>${actionLabel}</h2>
          <p>${place}</p>
          <div class="form-grid">
            <label>방문 날짜 <input name="date" type="date" min="${new Date().toISOString().slice(0, 10)}" required></label>
            <label>희망 시간 <select name="time"><option>오전 10:00</option><option>오후 1:00</option><option>오후 4:00</option><option>오후 7:00</option></select></label>
            <label>인원 <select name="people"><option>1명</option><option>2명</option><option>3명</option><option>4명 이상</option></select></label>
            <label>이름 <input name="name" type="text" placeholder="예약자 이름" required></label>
          </div>
          <div class="modal-actions"><button type="button" class="cancel">취소</button><button type="submit" class="submit">예약 요청하기</button></div>
        </form>`;
      document.body.append(modal);
      modal.querySelector('[name="name"]').focus();
      modal.querySelector('.cancel').addEventListener('click', () => modal.remove());
      modal.addEventListener('click', event => { if (event.target === modal) modal.remove(); });
      modal.querySelector('form').addEventListener('submit', event => {
        event.preventDefault();
        const form = event.currentTarget;
        alert(`${form.elements.name.value.trim()}님, ${place}\n${form.elements.date.value} ${form.elements.time.value} · ${form.elements.people.value} 예약 요청이 접수되었습니다.\n\n현재는 데모 예약 기능입니다. 실제 예약은 업체 확인 후 진행해 주세요.`);
        modal.remove();
      });
    }

    $('#retry').addEventListener('click', () => {
      index = 0;
      answers = [];
      $('#quiz').hidden = false;
      $('#resultScreen').hidden = true;
      document.querySelector('[data-tab="sport"]').click();
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
