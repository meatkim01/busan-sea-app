<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부산 바다 레저 취향</title><style>
:root{--b:#087eb4;--a:#18c8c8;--n:#063d60}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#d9f2f4,#e8effb);font-family:system-ui,sans-serif;color:#163548}.app{max-width:480px;min-height:100vh;margin:auto;padding:24px 20px;background:#fff;box-shadow:0 0 35px #164c6530}.k{margin:0;color:var(--b);font-size:11px;font-weight:800;letter-spacing:.1em}h1{font-size:24px;line-height:1.35}.progress{height:8px;border-radius:8px;background:#e9f2f3}.bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--b),var(--a));transition:.3s}.q{animation:in .25s}.num{color:var(--b);font-size:12px;font-weight:bold}.q h2{font-size:21px;line-height:1.45}.choice{width:100%;margin:10px 0;padding:17px;border:1px solid #d9e9ed;border-radius:17px;background:#fff;text-align:left;font-weight:700}.choice b{display:block;color:var(--b);font-size:11px;margin-bottom:5px}.result{padding:20px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#07567e,#0d9da9,#44d6cf)}.result h2{margin:0;font-size:25px}.route{display:grid;gap:8px;margin-top:15px}.route div{padding:11px;border-radius:10px;background:#ffffff24;font-size:13px}.tabs{display:flex;margin-top:20px;border-bottom:1px solid #dcebee}.tab{flex:1;padding:11px 2px;border:0;border-bottom:3px solid transparent;background:#fff;font-size:12px;color:#718491}.tab.active{border-color:var(--a);color:var(--b)}.panel{padding-top:15px}.panel[hidden]{display:none}.info{margin-bottom:9px;padding:13px;border:1px solid #dcebee;border-radius:14px;font-size:13px}.retry{width:100%;margin-top:20px;padding:14px;border:0;border-radius:15px;background:var(--b);color:#fff;font-weight:bold}@keyframes in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}</style><body><main class="app"><p class="k">BUSAN SEA LEISURE</p><h1>🌊 나만의 부산 바다<br>레저 취향 찾기</h1><section id="quiz"><p id="count" class="num"></p><div class="progress"><div id="bar" class="bar"></div></div><div id="q"></div></section><section id="out" hidden><div id="card" class="result"></div><nav id="tabs" class="tabs"><button class="tab active" data-t="sport">🏄 레저 정보</button><button class="tab" data-t="food">🍽️ 바닷가 맛집</button><button class="tab" data-t="traffic">🚌 교통·주차</button></nav><div id="sport" class="panel"></div><div id="food" class="panel" hidden></div><div id="traffic" class="panel" hidden></div><button id="retry" class="retry">테스트 다시 하기</button></section></main><script>
const Q=[['레저 강도','온몸으로 파도를 맞는 익스트림 스포츠 (서핑/제트스키)','잔잔하고 여유로운 힐링 레저 (SUP/요트)'],['파도 환경','파도가 높고 에너지가 넘치는 바다','수영·패들보드에 좋은 잔잔한 바다'],['바닷가 바닥','부드럽고 고운 모래 백사장','몽돌/자갈 해변과 암석 해안'],['바다 풍경','광안대교·마천루가 보이는 도시형 바다','지평선과 자연 해안 절벽'],['골든 타임','햇살 좋은 한낮 (12~15시)','로맨틱한 선셋 (18~19시)'],['해변 분위기','음악·펍·사람이 넘치는 에너지','파도 소리에 집중하는 조용함'],['수온·환경','따뜻한 수온과 완만한 수심','차가워도 투명하고 깨끗한 물'],['레저 후 휴식','오션뷰 카페·와인바','해녀촌·해산물 한잔'],['교통 기준','지하철역 바로 앞 대중교통','드라이브·넓은 주차장'],['여행 목표','해양 레저 스포츠 스킬 배우기','인생샷과 추억 남기기']];const R=[{n:'🏄‍♂️ 다이내믹 익스트림 서퍼',d:'에너지 넘치는 파도와 스킬 향상을 추구해요.',r:['송정 해수욕장 서핑','기장 해변열차','송정 해안 산책'],s:['서핑 입문 강습과 안전장비 대여','파도·기상 상황을 출발 전 확인'],f:['송정 해변 인근 카페·식당','기장 대변항 해산물 거리'],t:['동해선 송정역 이용','송정 공영주차장 확인']},{n:'⛵ 럭셔리 선셋 요트 세일러',d:'노을과 야경 속 여유로운 바다를 좋아해요.',r:['광안리 SUP/요트투어','광안대교 와인바','민락수변공원'],s:['광안리 SUP Zone·요트투어','선셋 시간대 사전 예약'],f:['광안리 오션뷰 와인바','민락수변공원 회센터'],t:['2호선 광안역·금련산역','민락수변공원 주차장']},{n:'🌊 자연 감성 오션 어드벤처',d:'절경과 자연 해안선에서 바다를 즐겨요.',r:['영도 태종대 유람선','자갈마당 해녀촌','영도 카페'],s:['태종대 해상 유람선','해안 산책화와 바람막이'],f:['태종대 인근 조개구이','영도 오션뷰 카페'],t:['남포역에서 태종대 버스','태종대 유원지 주차장']},{n:'🏖️ 여유로운 해변 힐링러',d:'조용한 해변에서 천천히 쉬어가고 싶어요.',r:['다대포 낙조분수/카이트','해안 산책','몰운대 전망'],s:['다대포 SUP·카이트 체험','일몰·분수 운영 시간 확인'],f:['다대포 해물칼국수','몰운대 인근 횟집'],t:['1호선 다대포해수욕장역','다대포 해변공원 주차장']}];let i=0,a=[];const $=s=>document.querySelector(s);function draw(){let x=Q[i];$('#count').textContent=`${i+1} / 10`;$('#bar').style.width=(i/10*100)+'%';$('#q').innerHTML=`<div class="q"><p class="num">Q${i+1}. [${x[0]}]</p><h2>${x[0]}은 무엇이 더 좋아?</h2><button class="choice" data-v="0"><b>A</b>${x[1]}</button><button class="choice" data-v="1"><b>B</b>${x[2]}</button></div>`}$('#q').onclick=e=>{let b=e.target.closest('[data-v]');if(!b)return;a.push(+b.dataset.v);if(++i<10)draw();else result()};function result(){let A=a.filter(x=>x===0).length,r=A>=7?0:A<=3?3:a[3]===0?1:2,o=R[r];$('#quiz').hidden=true;$('#out').hidden=false;$('#card').innerHTML=`<h2>${o.n}</h2><p>${o.d}</p><div class="route">${o.r.map((x,i)=>`<div>${i+1}. ${x}</div>`).join('')}</div>`;['sport','food','traffic'].forEach((k,i)=>$('#'+k).innerHTML=o[['s','f','t'][i]].map(x=>`<div class="info">${x}</div>`).join(''))}$('#tabs').onclick=e=>{let b=e.target.closest('.tab');if(b){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['sport','food','traffic'].forEach(x=>$('#'+x).hidden=x!==b.dataset.t)}};$('#retry').onclick=()=>{i=0;a=[];$('#quiz').hidden=false;$('#out').hidden=true;draw()};draw();</script><script>Object.assign(R[0],{r:["송정 해수욕장 · 부산 해운대구 송정해변로 36","서프홀릭 송정본점","료미 송정점 → 문토스트 본점"],s:["서프홀릭 송정본점 · 부산 해운대구 송정구길 47 1층","입문자 패키지 및 장비 렌탈 전문"],f:["료미 송정점 · 부산 해운대구 송정광정로 87 1층 · 오션뷰 퓨전 일식","문토스트 본점 · 부산 해운대구 송정해변로 16 · 치즈 토스트"],t:["동해선 송정역 2번 출구에서 도보 10분","185번 버스 후 송정해수욕장 입구 하차"]});Object.assign(R[1],{r:["광안리 해수욕장 & 수영만 요트경기장","크레이지서프 광안리 → 요트탈래 부산본점","톤쇼우 광안점 → Clam 광안리점"],s:["크레이지서프 광안리 · 부산 수영구 광안해변로54번길 3 · 광안대교 배경 SUP","요트탈래 부산본점 · 부산 해운대구 해운대해변로 84 수영만요트경기장"],f:["톤쇼우 광안점 · 부산 수영구 광안해변로279번길 13 · 돈카츠","Clam 광안리점 · 부산 수영구 광안해변로 225 · 타파스·와인"],t:["2호선 광안역 3·5번 출구에서 백사장 방면 도보 10분"]});Object.assign(R[2],{r:["영도 태종대 & 감지해변","태종대 곤포 유람선","자갈마당 해녀촌 → 피아크"],s:["태종대 곤포 유람선 · 부산 영도구 감지해변길 79 · 해안절벽·오륙도 순회"],f:["태종대 자갈마당 해녀촌 · 부산 영도구 감지해변길 81 · 숯불 조개구이","피아크(P.ARK) · 부산 영도구 해양로195번길 180 · 복합문화 카페"],t:["부산역 7번 출구 정류장 88·101번 → 태종대 종점"]});Object.assign(R[3],{r:["다대포 해수욕장 & 생태탐방로","다대포 카이트서핑 패들보드 클럽","할매집 → 다대포 낙조분수"],s:["다대포 카이트서핑 패들보드 클럽 · 부산 사하구 다대등대로 14 · 얕은 수심 패들보드"],f:["할매집 · 부산 사하구 다대하나거리 40 · 해물파전·문어삼합","웨이브온 커피 · 부산 기장군 장안읍 해맞이로 286 · 확장 코스"],t:["1호선 다대포해수욕장역 1·2번 출구에서 백사장 직결"]});</script></body></html>
