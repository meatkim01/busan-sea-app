<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나만의 부산 바다 레저 취향 찾기</title>
  <style>
    :root { --blue:#087eb4; --aqua:#18c8c8; --navy:#063d60; --ink:#163548; --line:#dcebee; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#d9f2f4,#e8effb); color:var(--ink); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
    .app { max-width:480px; min-height:100vh; margin:auto; padding:24px 20px 32px; background:#fff; box-shadow:0 0 35px #164c6530; }
    .eyebrow { margin:0; color:var(--blue); font-size:11px; font-weight:800; letter-spacing:.1em; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .topbar-actions { display:flex; align-items:center; gap:7px; flex-shrink:0; }
    .language-select { max-width:112px; min-height:34px; padding:7px 25px 7px 10px; border:1px solid #b9e5e7; border-radius:999px; background:#f1ffff; color:#08707c; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    #google_translate_element { display:none; }
    .account-button { flex-shrink:0; min-height:34px; padding:8px 11px; border:1px solid #b9e5e7; border-radius:999px; background:#f1ffff; color:#08707c; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    h1 { margin:8px 0 20px; font-size:25px; line-height:1.35; }
    .count { margin:0 0 8px; color:var(--blue); font-size:13px; font-weight:800; }
    .progress { height:8px; overflow:hidden; border-radius:8px; background:#e9f2f3; }
    .bar { height:100%; border-radius:8px; background:linear-gradient(90deg,var(--blue),var(--aqua)); transition:width .3s ease; }
    .question { animation:enter .25s ease; padding-top:18px; }
    .category { margin:0 0 8px; color:var(--blue); font-size:13px; font-weight:800; }
    .question h2 { margin:0 0 16px; font-size:22px; line-height:1.45; }
    .choice { width:100%; margin:9px 0; padding:17px; border:1px solid #d9e9ed; border-radius:17px; background:#fff; color:var(--ink); text-align:left; font:inherit; font-weight:700; line-height:1.45; cursor:pointer; transition:transform .15s,background .15s,border-color .15s; }
    .choice:hover, .choice:focus { border-color:var(--aqua); background:#f2ffff; transform:translateY(-1px); }
    .choice b { display:block; margin-bottom:5px; color:var(--blue); font-size:11px; letter-spacing:.08em; }
    .result { padding:20px; border-radius:22px; color:#fff; background:linear-gradient(135deg,#07567e,#0d9da9,#44d6cf); }
    .result h2 { margin:0; font-size:24px; line-height:1.35; }
    .result p { margin:8px 0 0; line-height:1.5; }
    .travel-media { overflow:hidden; margin-top:14px; border:1px solid var(--line); border-radius:18px; background:#fff; }
    .spot-photo { display:block; width:100%; height:190px; object-fit:cover; background:#e8f1f4; }
    .photo-loading { display:grid; min-height:150px; place-items:center; padding:18px; color:#5c7480; font-size:12px; text-align:center; }
    .photo-caption { padding:11px 13px; color:#5c7480; font-size:11px; line-height:1.45; }
    .photo-caption a { color:#087eb4; font-weight:800; text-decoration:none; }
    .review-summary { margin:0 13px 13px; padding:12px; border-radius:12px; background:#f3fbfd; }
    .review-summary strong { display:block; margin-bottom:4px; color:#07567e; font-size:12px; }
    .review-summary p { margin:0; color:#52707e; font-size:12px; line-height:1.5; }
    .review-summary a { display:inline-block; margin-top:7px; color:#087eb4; font-size:11px; font-weight:800; text-decoration:none; }
    .route { display:grid; gap:8px; margin-top:16px; }
    .route div { padding:11px; border-radius:10px; background:#ffffff24; font-size:13px; line-height:1.45; }
    .map-card { overflow:hidden; margin-top:16px; border:1px solid var(--line); border-radius:20px; background:#fff; }
    .map-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 14px 10px; }
    .map-heading strong { display:block; font-size:15px; }
    .map-heading small { display:block; margin-top:3px; color:#65808d; font-size:11px; }
    .density { display:inline-flex; align-items:center; gap:5px; flex-shrink:0; padding:6px 9px; border-radius:99px; font-size:11px; font-weight:800; }
    .density.busy { background:#fff0f0; color:#c52727; }
    .density.normal { background:#fff8df; color:#9a6900; }
    .density.quiet { background:#edf9f2; color:#16824c; }
    .map-frame { display:block; width:100%; height:210px; border:0; background:#e8f0f2; }
    .map-note { margin:0; padding:10px 14px 13px; color:#607a86; font-size:11px; line-height:1.5; }
    .congestion-guide { margin:0 14px 14px; padding:12px; border-radius:12px; background:#f7fafb; color:#58717d; font-size:11px; line-height:1.55; }
    .congestion-guide strong { display:block; margin-bottom:5px; color:#335c6d; font-size:12px; }
    .congestion-guide ul { margin:0; padding-left:17px; }
    .weather-card { display:flex; align-items:center; gap:10px; margin:14px; padding:12px; border:1px solid #c9e9ee; border-radius:13px; background:#f2fcff; }
    .weather-icon { display:grid; width:35px; height:35px; flex:0 0 35px; place-items:center; border-radius:50%; background:#dff8fb; font-size:21px; }
    .weather-card strong { display:block; color:#07567e; font-size:13px; }
    .weather-card p { margin:3px 0 0; color:#51727e; font-size:12px; }
    .tabs { display:flex; gap:2px; overflow-x:auto; margin-top:20px; border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:1 0 auto; padding:11px 9px; border:0; border-bottom:3px solid transparent; background:#fff; color:#718491; font:inherit; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .tab.active { border-color:var(--aqua); color:var(--blue); }
    .panel { padding-top:15px; }
    .panel[hidden] { display:none; }
    .info { margin-bottom:9px; padding:13px; border:1px solid var(--line); border-radius:14px; font-size:13px; line-height:1.55; }
    .event-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
    .event-meta strong { color:var(--navy); font-size:14px; }
    .event-status { flex-shrink:0; padding:4px 7px; border-radius:99px; font-size:10px; font-weight:800; }
    .event-status.live { background:#e9faf3; color:#148454; }
    .event-status.soon { background:#fff7df; color:#8b6700; }
    .event-status.check { background:#eef7ff; color:#176994; }
    .event-status.done { background:#f3f5f6; color:#70818b; }
    .event-detail { margin:0; color:#5e7884; font-size:12px; }
    .event-link { display:inline-flex; margin-top:10px; color:#087eb4; font-size:12px; font-weight:800; text-decoration:none; }
    .parking-title { margin:18px 0 9px; color:var(--navy); font-size:15px; }
    .parking { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .parking strong { display:block; margin-bottom:3px; }
    .parking p { margin:0; color:#5e7884; font-size:12px; }
    .parking-status { flex-shrink:0; padding:5px 8px; border-radius:99px; font-size:11px; font-weight:800; }
    .parking-status.busy { background:#fff0f0; color:#c52727; }
    .parking-status.normal { background:#fff8df; color:#9a6900; }
    .parking-status.quiet { background:#edf9f2; color:#16824c; }
    .directions { margin-top:14px; padding:15px; border:1px solid #bfe9ec; border-radius:15px; background:linear-gradient(135deg,#efffff,#f6fbff); }
    .directions strong { display:block; margin-bottom:5px; color:#07567e; font-size:14px; }
    .directions p { margin:0; color:#51727e; font-size:12px; line-height:1.5; }
    .directions-button { width:100%; margin-top:11px; padding:11px; border:0; border-radius:10px; background:#087eb4; color:#fff; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    .directions a.directions-button { display:block; text-align:center; text-decoration:none; }
    .directions-status { min-height:18px; margin:9px 0 0; color:#51727e; font-size:11px; line-height:1.4; }
    .directions-status.error { color:#c52727; }
    .reserve { width:100%; margin-top:10px; padding:10px; border:1px solid #93dce0; border-radius:10px; background:#edffff; color:#076d82; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    .retry { width:100%; margin-top:20px; padding:14px; border:0; border-radius:15px; background:var(--blue); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .modal-backdrop { position:fixed; inset:0; z-index:10; display:grid; place-items:end center; padding:16px; background:#001c2a88; }
    .modal { width:min(480px,100%); padding:20px; border-radius:22px; background:#fff; box-shadow:0 12px 40px #001c2a55; }
    .modal h2 { margin:0 0 6px; font-size:20px; }
    .modal p { margin:0 0 14px; color:#5a717d; font-size:13px; line-height:1.5; }
    .form-grid { display:grid; gap:10px; }
    .form-grid label { display:grid; gap:5px; font-size:12px; font-weight:800; }
    .form-grid input, .form-grid select { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); font:inherit; }
    .modal-actions { display:flex; gap:8px; margin-top:16px; }
    .modal-actions button { flex:1; padding:12px; border-radius:11px; font:inherit; font-weight:800; cursor:pointer; }
    .cancel { border:1px solid var(--line); background:#fff; color:#637b86; }
    .submit { border:0; background:var(--blue); color:#fff; }
    .auth-backdrop[hidden] { display:none; }
    .auth-backdrop { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:#001c2a88; }
    .auth-modal { width:min(420px,100%); padding:22px; border-radius:22px; background:#fff; box-shadow:0 12px 40px #001c2a55; }
    .auth-modal h2 { margin:0 0 6px; font-size:21px; }
    .auth-help { margin:0 0 16px; color:#607a86; font-size:12px; line-height:1.5; }
    .auth-switch { display:flex; gap:8px; margin-bottom:14px; }
    .auth-switch button { flex:1; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:#637b86; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
    .auth-switch button.active { border-color:var(--aqua); background:#efffff; color:#08707c; }
    .auth-message { min-height:18px; margin:10px 0 0; font-size:12px; line-height:1.4; }
    .auth-message.error { color:#c52727; }
    .auth-message.success { color:#16824c; }
    @keyframes enter { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <p class="eyebrow">BUSAN SEA LEISURE</p>
      <div class="topbar-actions">
        <select id="languageSelect" class="language-select" aria-label="언어 선택">
          <option value="ko">한국어</option>
          <option value="zh-TW">繁體中文（台灣）</option>
          <option value="zh-CN">简体中文</option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
        <button id="accountButton" class="account-button" type="button">로그인</button>
      </div>
    </div>
    <h1>🌊 나만의 부산 바다<br>레저 취향 찾기</h1>

    <section id="quiz">
      <p id="count" class="count"></p>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div id="question"></div>
    </section>

    <section id="resultScreen" hidden>
      <div id="resultCard" class="result"></div>
      <section id="travelMedia" class="travel-media" aria-label="여행지 사진"></section>
      <section id="mapCard" class="map-card" aria-label="추천 지역 지도와 예상 혼잡도"></section>
      <nav id="tabs" class="tabs" aria-label="추천 정보 탭">
        <button class="tab active" data-tab="sport">🏄 레저 정보</button>
        <button class="tab" data-tab="food">🍽️ 추천 맛집</button>
        <button class="tab" data-tab="traffic">🚌 교통 안내</button>
        <button class="tab" data-tab="events">🎉 체험·축제</button>
      </nav>
      <div id="sport" class="panel"></div>
      <div id="food" class="panel" hidden></div>
      <div id="traffic" class="panel" hidden></div>
      <div id="events" class="panel" hidden></div>
      <button id="retry" class="retry">테스트 다시 하기</button>
    </section>
  </main>
  <div id="google_translate_element" aria-hidden="true"></div>

  <div id="authModal" class="auth-backdrop" hidden>
    <section class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <h2 id="authTitle">부산 바다 앱 로그인</h2>
      <p id="authHelp" class="auth-help">이메일과 비밀번호로 로그인해 주세요.</p>
      <div class="auth-switch" aria-label="인증 방식">
        <button id="loginMode" class="active" type="button">로그인</button>
        <button id="signupMode" type="button">회원가입</button>
      </div>
      <form id="authForm" class="form-grid">
        <label>이메일 <input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <label>비밀번호 <input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상" required></label>
        <button id="authSubmit" class="submit" type="submit">로그인</button>
      </form>
      <p id="authMessage" class="auth-message" role="status"></p>
      <div class="modal-actions"><button id="authClose" class="cancel" type="button">닫기</button></div>
    </section>
  </div>

  <script>
    // 선택 순서는 A=0, B=1입니다. 결과는 선택 성향에 따라 계산됩니다.
